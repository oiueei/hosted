[tool.ruff]
line-length = 100
target-version = "py312"
# `*.md` because ruff 0.16 started formatting the Python inside Markdown code
# blocks, and this repo's Markdown is explanation: CLAUDE.md files, DESIGN.md and
# the skills under `.claude/`, full of snippets that exist to be *read* — several
# of them deliberately wrong, since that is what a bad→good pair is. Letting the
# formatter own the documentation is a policy worth choosing on purpose; it
# arrived instead as a side effect of a patch-level bump, turning CI red on two
# skill files. Delete this pattern if we ever decide we want it.
extend-exclude = ["**/migrations/**", "*.md"]

[tool.ruff.lint]
# E/W (pycodestyle) + F (pyflakes) cover what flake8 enforced; I adds isort.
select = ["E", "F", "I", "W"]
ignore = ["E203"]  # whitespace before ':' — conflicts with the formatter's slicing style

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"core/management/commands/seed_data/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "config"]

[tool.coverage.run]
source = ["core"]
branch = true
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]


# Mutation testing (dev-only, never in CI, never a declared dependency —
# `pip install mutmut` ad hoc). This section exists because mutmut cannot run in
# this repo without it, and the two non-obvious parts cost an afternoon to find:
# it copies the sources into ./mutants and runs there, so Django needs `config/`
# and `manage.py` copied along, and `frontend/public` too — the email service
# reads the inline logo from disk, and without it the baseline suite fails
# before a single mutant is generated. `also_copy` cannot name a nested file,
# only a directory or a top-level one.
#
# `only_mutate` is the per-run scope dial: mutating all of core/ is a
# multi-hour run nobody will wait for. Point it at what a round actually
# changed. Individual mutants can also be re-checked by name:
#   mutmut run core.utils.x_get_client_ip__mutmut_4
#
# NOTE: .claude/skills/solid-testing/scripts/mutation_test.sh still speaks the
# mutmut 2.x CLI (--paths-to-mutate / --tests-dir / --runner) and fails on 3.x.
[tool.mutmut]
source_paths = ["core/"]
pytest_add_cli_args_test_selection = ["core/tests/"]
only_mutate = [
    "core/services/invitation_service.py",
    "core/utils.py",
    "core/views/_helpers.py",
]
also_copy = ["pytest.ini", "manage.py", "config/", "conftest.py", "frontend/public"]
